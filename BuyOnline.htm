<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyOnline - Home</title>

    <!-- CSS to style the page -->
    <style>
        /* Reset some default browser styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Style for the body to set background color, font style, and text alignment */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            padding: 20px;
        }

        /* Styling the container for content */
        .container {
            max-width: 600px;
            margin: 50px auto; /* Adds space from the top */
            background-color: #fff;
            padding: 40px; /* Increased padding for more space inside */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center; /* Center content inside the container */
        }

        /* Style for the heading */
        h1 {
            color: #2c3e50;
            margin-bottom: 30px; /* Adds more space below the heading */
        }

        h2 {
            color: #2980b9;
            margin-bottom: 20px; /* Adds more space below the subheading */
        }

        /* Styling the navigation links */
        ul {
            list-style-type: none;
            padding: 0;
        }

        ul li {
            margin: 20px 0; /* Adds more vertical space between buttons */
        }

        /* Style for the links */
        a {
            display: inline-block; /* Make the links behave like buttons */
            width: 80%; /* Set width to be consistent */
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            color: #3498db;
            border: 2px solid #3498db;
            padding: 15px; /* Increase padding for more space */
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Hover effect for links */
        a:hover {
            background-color: #3498db;
            color: #fff;
        }

        /* Styling the footer message */
        p {
            margin-top: 30px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <!-- Main container for the page content -->
    <div class="container">
        <!-- Title of the page -->
        <h1>Welcome to BuyOnline</h1>
        <h2>Site Navigation</h2>

        <!-- Navigation list with links -->
        <ul>
            <li><a href="register.htm">Customer Registration</a></li>
            <li><a href="login.htm">Customer Login</a></li>
            <li><a href="mlogin.htm">Store Manager Login</a></li>
        </ul>

        <!-- Footer message -->
        <p>Please choose one of the options above to proceed.</p>
    </div>
</body>
</html>
