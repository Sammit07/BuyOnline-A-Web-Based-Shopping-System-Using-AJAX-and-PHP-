<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="description" content="Customer Registration" />
    <meta name="keywords" content="HTML, JavaScript, PHP, ajax, XML, XSLT" />
    <meta name="author" content="Sammit Raut" />
    <title>Customer Registration</title>

    <!-- Include CSS styling -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #msg {
            margin-top: 20px;
            color: red;
            font-weight: bold;
            text-align: center;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #3498db;
            text-decoration: none;
        }

        a:hover {
            color: #2980b9;
        }
    </style>

    <!-- Link to external JavaScript file -->
    <script type="text/javascript" src="testRegister.js"></script>
</head>
<body>
    <div class="container">
        <h1>Customer Registration</h1>
        <p>Please fill in the fields below to complete your registration.</p>

        <form id="registrationForm" onsubmit="return validateForm();">
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" required />
            
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" required />
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
            
            <label for="confirm_password">Re-type Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required />
            
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" placeholder="0d dddddddd or 0ddddddddd" required />
            
            <button type="submit">Register</button>
        </form>

        <p id="msg"></p>
        <a href="BuyOnline.htm">Back to BuyOnline</a>
    </div>
</body>
</html>
